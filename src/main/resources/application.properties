spring.application.name=pdf2tz
server.port=8081
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
pdf2tz.chunking.max-tokens=1200
pdf2tz.llm.router-ai.base-url=${ROUTERAI_BASE_URL:https://routerai.ru/api/v1}
pdf2tz.llm.router-ai.api-key=${ROUTERAI_API_KEY:}
pdf2tz.embeddings.enabled=${PDF2TZ_EMBEDDINGS_ENABLED:false}
pdf2tz.embeddings.model-path=${PDF2TZ_EMBEDDING_MODEL_PATH:}
pdf2tz.embeddings.similarity-threshold=${PDF2TZ_EMBEDDING_SIMILARITY_THRESHOLD:0.48}
pdf2tz.embeddings.contrast-margin=${PDF2TZ_EMBEDDING_CONTRAST_MARGIN:0.02}
pdf2tz.embeddings.max-candidates=${PDF2TZ_EMBEDDING_MAX_CANDIDATES:36}
pdf2tz.embeddings.batch-size=${PDF2TZ_EMBEDDING_BATCH_SIZE:8}
